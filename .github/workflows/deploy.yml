name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site-repo

      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: trsvax/tapestry-nocode
          path: content-repo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-repo/package-lock.json

      - name: Install
        run: npm ci
        working-directory: site-repo

      - name: Build
        working-directory: site-repo
        run: npm run build
        env:
          CONTENT_DIR: ${{ github.workspace }}/content-repo

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: site-repo/out/
          overwrite: true

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        working-directory: site-repo
        run: aws s3 sync out/ s3://${{ secrets.S3_BUCKET }}/books/tapestry-nocode/ --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/books/tapestry-nocode/*"
